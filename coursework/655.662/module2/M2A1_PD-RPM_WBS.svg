  <text x="12" y="611" font-size="11" font-weight="700" fill="#1F3864">Outside the WBS — required for operation, not built by this project (interface defined instead):</text>
  <text x="20" y="629" font-size="10" fill="#333">•  PD cycler — manufacturer’s regulated Class II device; interface defined at 1.1.1</text>
  <text x="20" y="643" font-size="10" fill="#333">•  Broadband / cellular carrier network; interface defined at 1.2.1</text>
