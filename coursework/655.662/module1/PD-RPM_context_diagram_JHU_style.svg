  <line x1="515" y1="586" x2="515" y2="484" stroke="#000" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="524" y="524" text-anchor="start" font-size="13.5" font-style="italic" fill="#333">power,</text>
  <text x="524" y="539" text-anchor="start" font-size="13.5" font-style="italic" fill="#333">broadband</text>
  <text x="515" y="618" text-anchor="middle" font-size="22" fill="#000">Infrastructure</text>
  <line x1="640" y1="586" x2="640" y2="484" stroke="#000" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="649" y="524" text-anchor="start" font-size="13.5" font-style="italic" fill="#333">storage,</text>
  <text x="649" y="539" text-anchor="start" font-size="13.5" font-style="italic" fill="#333">cycler space</text>
  <text x="640" y="618" text-anchor="middle" font-size="22" fill="#000">Home</text>
  <text x="640" y="646" text-anchor="middle" font-size="22" fill="#000">Layout</text>
  <line x1="765" y1="586" x2="765" y2="484" stroke="#000" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="774" y="524" text-anchor="start" font-size="13.5" font-style="italic" fill="#333">training,</text>
  <text x="774" y="539" text-anchor="start" font-size="13.5" font-style="italic" fill="#333">field support</text>
  <text x="765" y="618" text-anchor="middle" font-size="22" fill="#000">Personnel</text>

  <rect x="500" y="300" width="280" height="170" fill="#000000" stroke="#1F3864" stroke-width="3"/>
  <text x="640" y="356" text-anchor="middle" font-size="25" font-weight="700" fill="#FFF">Peritoneal Dialysis</text>
  <text x="640" y="389" text-anchor="middle" font-size="25" font-weight="700" fill="#FFF">Remote Monitoring</text>
  <text x="640" y="422" text-anchor="middle" font-size="25" font-weight="700" fill="#FFF">System</text>

  <rect x="960" y="656" width="290" height="40" fill="#E4E4E4"/>
  <text x="1105" y="682" text-anchor="middle" font-size="17" font-weight="700" fill="#000">Context Diagram is a “black box”</text>
</svg>