  <text x="220" y="338" text-anchor="end" font-size="22" fill="#000">Patient</text>
  <line x1="235" y1="330" x2="486" y2="330" stroke="#000" stroke-width="2.2" marker-end="url(#a)"/>
  <text x="360" y="307" text-anchor="middle" font-size="13.5" font-style="italic" fill="#333">weight, BP, symptoms,</text>
